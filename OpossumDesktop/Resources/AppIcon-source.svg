<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#453a63"/>
      <stop offset="100%" stop-color="#211a30"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="36%" r="60%">
      <stop offset="0%" stop-color="#5a4a80" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a4a80" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- crescent moon, clear of the ears -->
  <circle cx="860" cy="176" r="60" fill="#f1e6cf" opacity="0.9"/>
  <circle cx="884" cy="160" r="54" fill="#241d38"/>

  <!-- ears: dark, leathery, the giveaway silhouette -->
  <circle cx="358" cy="336" r="112" fill="#2a2240"/>
  <circle cx="666" cy="336" r="112" fill="#2a2240"/>
  <circle cx="358" cy="336" r="112" fill="none" stroke="#3a2f56" stroke-width="6" opacity="0.6"/>
  <circle cx="666" cy="336" r="112" fill="none" stroke="#3a2f56" stroke-width="6" opacity="0.6"/>

  <!-- head, tapering to a long pointed snout: three stacked ellipses of the
       same fill (no stroke) fuse into one smooth wedge-shaped silhouette -->
  <ellipse cx="512" cy="510" rx="252" ry="196" fill="#f1e6cf"/>
  <ellipse cx="512" cy="668" rx="164" ry="150" fill="#f1e6cf"/>
  <ellipse cx="512" cy="800" rx="82" ry="88" fill="#f1e6cf"/>

  <!-- eyes -->
  <circle cx="420" cy="516" r="34" fill="#241d38"/>
  <circle cx="604" cy="516" r="34" fill="#241d38"/>
  <circle cx="408" cy="503" r="9" fill="#f1e6cf"/>
  <circle cx="592" cy="503" r="9" fill="#f1e6cf"/>

  <!-- nose -->
  <ellipse cx="512" cy="820" rx="28" ry="21" fill="#241d38"/>
</svg>

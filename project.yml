name: OpossumDesktop
options:
  bundleIdPrefix: ai.opossum-desktop
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  OpossumKit:
    path: OpossumKit

targets:
  OpossumDesktop:
    type: application
    platform: macOS
    sources:
      - path: OpossumDesktop
    dependencies:
      - package: OpossumKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.opossum-desktop.app
        PRODUCT_NAME: "Opossum Desktop"
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ENABLE_APP_SANDBOX: false
        ENABLE_HARDENED_RUNTIME: false
        # Ad-hoc sign the whole bundle (no Developer ID needed). CODE_SIGNING_ALLOWED must stay
        # true for this: with it false, Xcode skips its CodeSign build phase entirely and only
        # the linker's minimal auto-signature applies to the raw executable — which does NOT
        # seal Resources or bind Info.plist. That half-signed state is what left the Dock (an
        # execution-time context) refusing the custom icon while Finder (passive file browsing)
        # still rendered it fine.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: false
        CODE_SIGNING_ALLOWED: true
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: false
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: []
      config: Debug
